name: Initialize source files
on:
  push:
    paths: ['.source-upload.ready']
permissions:
  contents: write
jobs:
  initialize:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Unpack verified source files
        env:
          EXPECTED_SHA256: 35f6085254185ae5e25486a6fa4fdb735cfaaf980d8698769d280fa10773a030
        run: |
          python3 - <<'PYCODE'
          import base64, hashlib, io, os, pathlib, stat, zipfile
          parts = sorted(pathlib.Path('.').glob('.source-upload.part*'))
          data = base64.b64decode(''.join(p.read_text().strip() for p in parts), validate=True)
          assert hashlib.sha256(data).hexdigest() == os.environ['EXPECTED_SHA256']
          with zipfile.ZipFile(io.BytesIO(data)) as bundle:
              for entry in bundle.infolist():
                  path = pathlib.PurePosixPath(entry.filename)
                  assert not path.is_absolute() and '..' not in path.parts
                  assert not set(path.parts) & {'.git', '.github', '.local', '.runtime', 'node_modules', 'output', '__pycache__'}
                  assert not stat.S_ISLNK(entry.external_attr >> 16)
                  target = pathlib.Path(*path.parts)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(bundle.read(entry))
          for part in parts: part.unlink()
          pathlib.Path('.source-upload.ready').unlink()
          PYCODE
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m 'Add application source, assets and guides'
          git push origin HEAD:main
