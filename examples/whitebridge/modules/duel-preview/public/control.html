<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="owner-token" content="__OWNER_TOKEN__"><title>预览控制台 · 仅本机</title><link rel="stylesheet" href="/control.css"></head><body>
<header><h1>家长会还没散 <span>预览控制台</span></h1><p>战场在独立 Linux 虚拟机内运行。只展示游戏画面；本页用于你自己的操作。</p></header>
<main><section class="screen"><iframe title="只读游戏画面" src="http://127.0.0.1:4390/?side=demon" allow="autoplay"></iframe><p><a href="http://127.0.0.1:4390/?side=demon" target="_blank" rel="noopener">打开魔族画面 ↗</a><a href="http://127.0.0.1:4390/?side=human" target="_blank" rel="noopener">打开勇者画面 ↗</a><span>点击画面右上角，启用合成角色配音</span></p></section>
<aside><section><h2>看它怎么打</h2><p>默认切磋不会结束人格；实战演示有真实伤害，败方由长辈接班。这里所有援军都是本地测试。</p><div class="buttons"><button data-action="showcase">开始实战演示</button><button data-action="sparring">回到无人切磋</button><button data-action="pause">暂停 / 继续</button></div><label>演示速度 <select id="speed"><option value="1">正常速度</option><option value="2">2 倍</option><option value="4">4 倍</option></select></label></section>
<section><h2>检查角色差分</h2><label>辈分 <select id="rank"><option value="0">年轻一代 · 无冠</option><option value="1">父亲 · 一顶皇冠</option><option value="2">祖父 · 两顶皇冠</option></select></label><label>表情 / 动作 <select id="pose"><option value="0">沉着 · 站立</option><option value="1">得意 · 嘲讽</option><option value="2">愤怒 · 进攻</option><option value="3">惊慌 · 受击</option></select></label><button id="inspect">展示两边角色（暂停战斗）</button><p>本批绘制到祖父。更高辈分的专属老化立绘尚未绘制，不能算已完成。</p></section>
<section><h2>给一边测试援军</h2><label>阵营 <select id="side"><option value="demon">魔族</option><option value="human">勇者</option></select></label><label>兵种 <select id="unit"><option value="militia">民兵</option><option value="shield">盾卫</option><option value="pike">枪兵</option><option value="bow">重弩手</option><option value="rider">突骑</option><option value="mage">爆破术士</option><option value="healer">祈愿师</option><option value="siege">攻城傀儡</option></select></label><button id="summon">投放系统援军</button><p>受人口与部署预算限制，不伪装成礼物或真人观众。</p></section>
<section class="status"><h2>当前状态</h2><p id="status">连接中…</p><p id="feedback" aria-live="polite"></p><p>平台：均未连接<br>决策：本地规则 AI<br>声音：预先生成的 Qwen3-TTS 配音<br>付费模型调用：0 · 公共直播：未启动</p></section></aside></main><script type="module" src="/control.js"></script></body></html>
